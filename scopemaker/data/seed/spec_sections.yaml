# Specification sections offered as cross-references when building a scope.
#
# `division` is where the section actually lives. `related` lists the *other*
# divisions whose scopes should also be offered it -- this is the mechanism
# that catches the classic scope gap where a fire protection package silently
# omits the Division 07 firestopping it is contractually responsible for.
#
# `universal: true` marks Division 01 procedural sections that belong on every
# trade's exhibit.
#
# Section numbers reproduced here are limited to those in common public use as
# cross-references in bid documents. The complete MasterFormat section list is
# published and copyrighted by CSI; organizations should load their own project
# specification index for authoritative numbering.
version: 1

