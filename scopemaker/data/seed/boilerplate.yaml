# Prose boilerplate for the non-list sections of an exhibit.
#
# Placeholders in {braces} are substituted by scopemaker.services.scope_builder
# from the scope, project and bid package. A placeholder with no available value
# renders as a blank-line marker the author is expected to fill in, never as the
# literal placeholder text.
version: 1

boilerplate:
  intent: |
    <p>In general, this Bid Package is comprehensive to the specific CSI Division
    Work and related Work as referenced, indicated on, or implied by the Project
    Drawings, Specifications and Project Manual. Subcontractor acknowledges that
    the following Scope of Work detail is provided as a courtesy and must be used
    in conjunction with <strong><u>all</u></strong> Project Documents. The Scope of
    Work detail listed is not intended to describe a complete and final work
    scope; it is provided as a summary overview only. Nothing in this Exhibit
    relieves the Subcontractor of any obligation set out in the Contract
    Documents.</p>

  summary_lead: |
    The Scope of Work shall include the furnishing and installation, complete, of
    the <strong>{trade_upper} Work</strong> as outlined in the
    <strong><u>Contract Bidding Requirements</u></strong> and in accordance with
    the <strong><u>Contract Documents</u></strong>.

  summary_means_and_methods: |
    This shall include, but is not limited to, all required engineering,
    submittals (including samples, mock-ups and shop drawings), materials,
    fabrication, labor, equipment and tools, supervision, hoisting, scaffolding,
    transportation, licenses, burden and taxes, sales taxes, and insurances as
    required for a complete and operational installation.

