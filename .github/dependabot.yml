version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # One PR for routine bumps keeps the noise down; anything that fails CI
      # gets looked at individually.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"
