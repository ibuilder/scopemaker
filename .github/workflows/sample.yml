name: Build sample exhibits

# Renders a real set of exhibits and uploads them as a downloadable artifact.
# Useful for reviewing output without installing the PDF stack locally: the
# GitHub runner has Pango and cairo, a Windows workstation usually does not.
on:
  workflow_dispatch:
    inputs:
      divisions:
        description: "Comma-separated CSI divisions to generate"
        default: "21,22,23,26,09,31"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Render sample exhibits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info \
            fonts-dejavu-core fonts-liberation2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[dev]"

      - name: Generate the exhibits
        env:
          FLASK_ENV: development
          SECRET_KEY: sample-build-only
          ENCRYPTION_KEY: PHMYRQ3sBQGmWfQFOWfLWCkV1s0MnBGKcpS4iFctuNM=
          DATABASE_URL: sqlite:///sample.sqlite3
          DIVISIONS: ${{ inputs.divisions }}
        run: python scripts/build_samples.py

      - name: Summarise
        run: cat samples/SUMMARY.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: scopemaker-sample-exhibits
          path: samples/
          retention-days: 30
          if-no-files-found: error
