services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scopemaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scopemaker-dev-password}
      POSTGRES_DB: scopemaker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopemaker -d scopemaker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql+psycopg://scopemaker:${POSTGRES_PASSWORD:-scopemaker-dev-password}@db:5432/scopemaker
      # Generate real values before exposing this to anyone:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      LOG_FORMAT: json
      # Shared rate-limit state. Without this each gunicorn worker keeps its
      # own counters and the configured limits are silently multiplied.
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # Password resets and invitations need a real relay.
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER: ${MAIL_SENDER:-scopemaker@localhost}
      PROCORE_ENABLED: ${PROCORE_ENABLED:-0}
      PROCORE_CLIENT_ID: ${PROCORE_CLIENT_ID:-}
      PROCORE_CLIENT_SECRET: ${PROCORE_CLIENT_SECRET:-}
      PROCORE_REDIRECT_URI: ${PROCORE_REDIRECT_URI:-http://localhost:8000/procore/callback}
      # Rendering happens in the worker below, off the request path.
      RENDER_ASYNC: "1"
      # /metrics stays 404 until this is set.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

  # Renders queued documents. Scale it with `docker compose up -d --scale
  # worker=3`; workers claim jobs with a conditional UPDATE, so several can
  # share one queue safely.
  worker:
    build: .
    command: ["flask", "run-worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql+psycopg://scopemaker:${POSTGRES_PASSWORD:-scopemaker-dev-password}@db:5432/scopemaker
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      # The web service already migrated and seeded; doing it again here would
      # just be two processes racing for the same lock.
      RUN_MIGRATIONS: "0"
      SEED_LIBRARY: "0"
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_SENDER: ${MAIL_SENDER:-scopemaker@localhost}
      LOG_FORMAT: json
      RENDER_ASYNC: "1"
    restart: unless-stopped

volumes:
  pgdata:
